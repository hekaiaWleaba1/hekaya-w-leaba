
<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متاهة الأبواب السحرية | حكاية ولعبة</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(160deg,#b7e6fa,#fceac7);min-height:100vh;color:#263c50}.wrap{max-width:530px;margin:auto;padding:18px}.panel{background:#fffdf6;border:4px solid #fff;border-radius:28px;box-shadow:0 12px 35px #42607933;padding:20px;text-align:center}h1{font-size:27px;margin:12px 0;color:#7349a3}h2{font-size:23px}p{line-height:1.8}.brand{font-weight:bold;color:#d05e85}.maze{position:relative;height:240px;background:linear-gradient(#7ac9e7 0 65%,#9bda8a 65%);border-radius:20px;overflow:hidden;border:5px solid #fff;direction:ltr}.maze:before{content:'☁️　☁️　☀️';position:absolute;top:8px;left:15px;font-size:26px}.path{position:absolute;left:7%;right:7%;top:53%;height:75px;background:#f3d5a0;border:5px dashed #e3b873;border-radius:50%}.doors{position:absolute;left:3%;right:3%;top:65px;display:flex;justify-content:space-around;align-items:end;height:130px}.door{width:16%;height:95px;border:5px solid #8053a5;background:#bd8ad8;border-radius:30px 30px 5px 5px;display:grid;place-items:center;font-size:25px;box-shadow:3px 6px #78518d}.door.passed{background:#9ddf9a;border-color:#3f9a70}.door.current{background:#ffcf70;border-color:#dc8935;transform:translateY(-10px);box-shadow:0 0 0 5px #fff5b2}.avatar{position:absolute;bottom:5px;left:calc(3% + var(--pos)*19%);font-size:33px;transition:left .6s}.options{display:grid;gap:12px;margin:20px 0}.option{border:3px solid #e7d9fa;border-radius:17px;padding:15px;background:#f7f0ff;font-size:20px;font-weight:bold;cursor:pointer;color:#46305e}.option:focus-visible,button:focus-visible{outline:4px solid #2589d3}.option:hover{background:#eee0ff}.option.correct{background:#c9f5d4;border-color:#47b574}.option.wrong{background:#ffe0df;border-color:#e87d76}.primary{border:0;border-radius:20px;background:#8156c6;color:white;font-weight:bold;font-size:21px;padding:15px 25px;cursor:pointer;min-height:54px;width:100%}.primary:disabled{opacity:.5}.secondary{border:0;background:#f9e4a7;border-radius:15px;padding:10px 16px;font-size:17px;cursor:pointer}.message{min-height:40px;font-weight:bold;font-size:19px}.score{font-size:19px;font-weight:bold;color:#9a6616}.hidden{display:none}.reward{font-size:66px;animation:pop 1s ease-in-out infinite alternate}@keyframes pop{to{transform:scale(1.15)}}footer{font-size:13px;color:#60758b;margin-top:15px}@media(max-width:390px){.wrap{padding:8px}.panel{padding:13px}h1{font-size:23px}.door{font-size:20px}.option{font-size:18px}}</style></head><body><main class="wrap"><section class="panel"><div class="brand">حكاية ولعبة</div><h1>🏰 متاهة الأبواب السحرية</h1><div class="maze" aria-label="متاهة من خمسة أبواب"><div class="path"></div><div class="doors" id="doors"></div><div class="avatar" id="avatar">🧒</div></div><div id="intro"><h2>جاهز للمغامرة؟ 🎒</h2><p>حل خمسة ألغاز وافتح الأبواب واحد ورا التاني لحد ما توصل للكنز السحري!</p><button class="primary" onclick="start()">🚀 ابدأ اللعب</button></div><div id="play" class="hidden"><p class="score" id="score"></p><h2 id="question"></h2><div class="options" id="options"></div><div class="message" id="message" aria-live="polite"></div><button class="secondary" id="hint" onclick="showHint()">💡 مساعدة</button><button class="primary hidden" id="next" onclick="advance()">🚪 الباب التالي</button></div><div id="finish" class="hidden"><div class="reward">🏆🎁🌟</div><h2>مبروك يا بطل المتاهة!</h2><p>فتحت كل الأبواب ووصلت للكنز!<br>استحقّيت وسام المستكشف الذكي 🏅</p><p class="score" id="finalscore"></p><button class="primary" onclick="start()">🔄 العب من جديد</button></div><footer>لعبة تعليمية مجانية للأطفال • حكاية ولعبة</footer></section></main><script>const levels=[{q:'أي كلمة تبدأ بحرف الألف؟',a:['🐰 أرنب','🐱 قطة','🍌 موزة'],c:0,h:'الأرنب يبدأ بحرف أ'},{q:'كام حاصل جمع ٢ + ٢؟',a:['٣','٤','٥'],c:1,h:'عد اتنين واتنين على صوابعك'},{q:'مين الحيوان اللي بيقول مووو؟',a:['🐶 الكلب','🐄 البقرة','🐦 العصفور'],c:1,h:'الحيوان اللي بيدينا اللبن'},{q:'أي شكل له ٣ أضلاع؟',a:['⚪ دائرة','🔺 مثلث','🟦 مربع'],c:1,h:'شبه سقف البيت'},{q:'ما لون الشمس في الرسومات؟',a:['🔵 أزرق','🟣 بنفسجي','🟡 أصفر'],c:2,h:'نفس لون الموز الناضج'}];let index=0,stars=0,attempt=0,solved=false;const $=id=>document.getElementById(id);function draw(){$('doors').innerHTML=levels.map((_,i)=>`<div class="door ${i<index?'passed':i===index?'current':''}" aria-label="الباب ${i+1}">${i<index?'⭐':i===index&&solved?'🔓':'🔒'}</div>`).join('');$('avatar').style.setProperty('--pos',Math.min(index,5));}function start(){index=0;stars=0;attempt=0;solved=false;$('intro').classList.add('hidden');$('finish').classList.add('hidden');$('play').classList.remove('hidden');render()}function render(){solved=false;attempt=0;draw();$('score').textContent=`🚪 الباب ${index+1} من ٥ | ⭐ ${stars} نجوم`;$('question').textContent=levels[index].q;$('message').textContent='اختار الإجابة الصح علشان تفتح الباب';$('options').innerHTML='';levels[index].a.forEach((answer,i)=>{const b=document.createElement('button');b.className='option';b.textContent=answer;b.onclick=()=>choose(i,b);$('options').appendChild(b)});$('next').classList.add('hidden');$('hint').classList.remove('hidden')}function choose(i,button){if(solved)return;const correct=levels[index].c;if(i===correct){solved=true;if(attempt===0)stars++;button.classList.add('correct');$('options').querySelectorAll('button').forEach(b=>b.disabled=true);$('message').textContent='🎉 برافو! الباب اتفتح!';$('next').textContent=index===4?'🎁 افتح الكنز':'🚪 الباب التالي';$('next').classList.remove('hidden');$('hint').classList.add('hidden');draw();sound(true)}else{attempt++;button.classList.add('wrong');$('message').textContent='💛 حاول مرة تانية يا بطل!';sound(false);setTimeout(()=>button.classList.remove('wrong'),650)}}function showHint(){$('message').textContent='💡 '+levels[index].h}function advance(){index++;if(index===levels.length){$('play').classList.add('hidden');$('finish').classList.remove('hidden');$('finalscore').textContent=`جمعت ${stars} من ٥ نجوم ⭐`;draw();sound(true)}else render()}function sound(good){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();[0,1,2].slice(0,good?3:1).forEach((n)=>{let osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=(good?[523,659,784]:[250])[n];gain.gain.setValueAtTime(.06,ctx.currentTime+n*.13);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+n*.13+.12);osc.connect(gain);gain.connect(ctx.destination);osc.start(ctx.currentTime+n*.13);osc.stop(ctx.currentTime+n*.13+.13)})}catch(e){}}draw();</script></body></html>
